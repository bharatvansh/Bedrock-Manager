name: "🐛 Bug Report"
description: Report an issue, crash, or unexpected behavior in Bedrock Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **Bedrock Manager**! Please fill out this form with as much detail as possible to help us reproduce and resolve the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: What part of Bedrock Manager does this issue relate to?
      options:
        - "Smart Installer & Pack Extraction (Install page / Process Log)"
        - "Add-on Library & Pack Management (Addons page)"
        - "Worlds & Live NBT Editor (Worlds page / level.dat / Gamerules)"
        - "2D & 3D Skin Studio (Skins page / Skin Packs)"
        - "Add-on Profiles & Loadouts (Profiles page)"
        - "\"Peek Inside\" Archive Inspector (File / Code / Audio viewer)"
        - "BYOS Cloud Backups & Restore (Google Drive / Snapshots)"
        - "Cloud Account & Profile Sync"
        - "Marketplace Browser"
        - "Auto-Updater / App Startup / Performance"
        - "UI, Themes & Localization"
        - "Other / General"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Bedrock Manager Version
      description: Found in **Settings > About** or in the top-right / title bar (e.g. `v1.7.5`).
      placeholder: e.g. v1.7.5
    validations:
      required: true

  - type: dropdown
    id: os-version
    attributes:
      label: Operating System & Architecture
      description: Select your Windows platform.
      options:
        - "Windows 11 64-bit (x64)"
        - "Windows 11 ARM64"
        - "Windows 10 64-bit (x64)"
        - "Windows 10 ARM64"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Bedrock Version
      description: The version of Minecraft: Bedrock Edition installed on your system (visible on the game title screen).
      placeholder: e.g. 1.21.20
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Summary of the Bug
      description: A clear and concise summary of what went wrong.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce (Optional)
      description: How can we reproduce the issue step by step?
      placeholder: |
        1. Go to '...'
        2. Drag and drop 'example.mcpack' (or click '...')
        3. Observe error '...'
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g. The pack should have installed and appeared in the Add-ons library.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Details & Diagnostic Output
      description: |
        Paste error messages from toast popups, expandable cards in the **Install > Process Log** ("Show Details"), or terminal console errors.
      render: shell
      placeholder: Paste error details or stack traces here...
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots & Sample Files
      description: Drag and drop screenshots, screen recordings, or sample non-copyrighted `.mcpack`/`.mcaddon` test files that reproduce the problem.
    validations:
      required: false